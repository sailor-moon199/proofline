[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "proofline"
version = "0.1.0"
description = "An evidence-backed AI opportunity audit tool"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["proofline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
